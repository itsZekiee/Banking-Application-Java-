server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: banking-backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/pbc_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  cors:
    allowed-origins:
      - "http://localhost:3000"
      - "http://localhost:8080"
      - "http://10.0.2.2"
      - "http://10.0.2.2:8080"
