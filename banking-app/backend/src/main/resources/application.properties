# ==============================================================================
# Spring Boot Configuration for Banking Application
# ==============================================================================

# Server Port Configuration
server.port=8080
server.servlet.context-path=/

# ------------------------------------------------------------------------------
# Database Connection Settings (MySQL / PostgreSQL Placeholders)
# ------------------------------------------------------------------------------
# MySQL Configuration (Default placeholder)
spring.datasource.url=jdbc:mysql://localhost:3306/banking_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# PostgreSQL Alternative (Uncomment to use PostgreSQL instead of MySQL)
# spring.datasource.url=jdbc:postgresql://localhost:5432/banking_db
# spring.datasource.username=postgres
# spring.datasource.password=postgres
# spring.datasource.driver-class-name=org.postgresql.Driver

# ------------------------------------------------------------------------------
# JPA / Hibernate Configuration
# ------------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ------------------------------------------------------------------------------
# CORS Allowed Origins Configuration
# Comma-separated list of permitted origins (Web & Mobile dev clients)
# ------------------------------------------------------------------------------
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:19006,http://10.0.2.2:8080
